<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feel Good Soda – Coming Soon</title>
<meta name="description" content="World's first feel good soda. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ground:#FFE7A8;--ink:#2B1A4A;--accent:#C7381E}
html,body{margin:0;height:100%;overflow:hidden}
main{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;box-sizing:border-box}
.eyebrow{position:relative;margin:0 0 28px;font-size:14px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
h1{position:relative;margin:0;max-width:1100px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:33px;line-height:.95;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.dots{position:relative;margin-top:40px;display:flex;gap:10px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.dots span:nth-child(2){background:var(--ink)}
.bubble{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(43,26,74,.18);background:rgba(255,255,255,.35);animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(14px,-55vh)}100%{transform:translate(-6px,-115vh)}}
@media (prefers-reduced-motion:reduce){.bubble{display:none}}
</style>
</head>
<body>
<main>
<span class="bubble" aria-hidden="true" style="left: 21%; width: 18px; height: 18px; animation-duration: 10.6s; animation-delay: -0.8s"></span>
<span class="bubble" aria-hidden="true" style="left: 14%; width: 32px; height: 32px; animation-duration: 10.3s; animation-delay: -0.9s"></span>

<span class="bubble" aria-hidden="true" style="left: 17%; width: 32px; height: 32px; animation-duration: 15.5s; animation-delay: -10.1s"></span>
<span class="bubble" aria-hidden="true" style="left: 9%; width: 32px; height: 32px; animation-duration: 12.2s; animation-delay: -6.3s"></span>
<span class="bubble" aria-hidden="true" style="left: 7%; width: 14px; height: 14px; animation-duration: 12.0s; animation-delay: -2.1s"></span>
<span class="bubble" aria-hidden="true" style="left: 20%; width: 24px; height: 24px; animation-duration: 11.9s; animation-delay: -9.1s"></span>
<span class="bubble" aria-hidden="true" style="left: 89%; width: 32px; height: 32px; animation-duration: 8.6s; animation-delay: -9.3s"></span>
<span class="bubble" aria-hidden="true" style="left: 26%; width: 44px; height: 44px; animation-duration: 10.4s; animation-delay: -8.8s"></span>
<span class="bubble" aria-hidden="true" style="left: 74%; width: 10px; height: 10px; animation-duration: 7.5s; animation-delay: -3.3s"></span>
<span class="bubble" aria-hidden="true" style="left: 70%; width: 44px; height: 44px; animation-duration: 10.8s; animation-delay: -5.0s"></span>
<span class="bubble" aria-hidden="true" style="left: 60%; width: 32px; height: 32px; animation-duration: 10.3s; animation-delay: -4.0s"></span>
<span class="bubble" aria-hidden="true" style="left: 91%; width: 14px; height: 14px; animation-duration: 14.0s; animation-delay: -1.3s"></span>
<span class="bubble" aria-hidden="true" style="left: 69%; width: 18px; height: 18px; animation-duration: 11.5s; animation-delay: -5.5s"></span>
<span class="bubble" aria-hidden="true" style="left: 38%; width: 24px; height: 24px; animation-duration: 12.5s; animation-delay: -1.2s"></span>
<span class="bubble" aria-hidden="true" style="left: 55%; width: 32px; height: 32px; animation-duration: 8.5s; animation-delay: -5.5s"></span>
<span class="bubble" aria-hidden="true" style="left: 55%; width: 24px; height: 24px; animation-duration: 7.4s; animation-delay: -10.7s"></span>
<p class="eyebrow">Coming soon</p>
<h1>World’s first <span>feel good</span> soda</h1>
<div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
</main>
</body>
</html>
